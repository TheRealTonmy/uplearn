<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Study Helper</title>
    <style>
      body { width: 320px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 12px; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      label { font-size: 12px; color: #374151; display:block; margin-top:6px; }
      input { width: 100%; margin-top: 4px; margin-bottom: 8px; padding: 6px; border: 1px solid #e5e7eb; border-radius: 8px; }
      button { width: 100%; padding: 8px; border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 10px; cursor: pointer; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .ok { color: #059669; } .bad { color: #dc2626; } .muted { color:#6b7280; font-size:12px; }
    </style>
  </head>
  <body>
    <h1>Study Helper</h1>
    <p class="muted">Fill these to enable AI features. Use Gemini or OpenAI-style providers.</p>

    <label>API Base URL
      <input id="apiBase" placeholder="e.g. https://generativelanguage.googleapis.com" />
    </label>
    <label>API Key
      <input id="apiKey" placeholder="AIza... or sk-..." />
    </label>
    <label>Model
      <input id="model" placeholder="gemini-1.5-flash or gpt-4o-mini" />
    </label>

    <div class="row" style="margin-top:8px;">
      <button id="save">Save</button>
      <button id="inject">Open Sidebar</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button id="test">Test API</button>
      <button id="clear">Clear</button>
    </div>
    <p id="testResult" class="muted"></p>

    <script src="popup.js"></script>
  </body>
</html>
